// INDEXEDDB PERSISTENCE
// ═══════════════════════════════════════════════════════════
const DB = {
  _db: null,
  async init() {
    if (DB._db) return;
    return new Promise((res, rej) => {
      const r = indexedDB.open('byma-trader-v2', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => {
        DB._db = r.result;
        res();
      };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k, def = null) {
    try {
      await DB.init();
      return new Promise(r => {
        const tx = DB._db.transaction('kv', 'readonly');
        const req = tx.objectStore('kv').get(k);
        req.onsuccess = () => r(req.result ?? def);
        req.onerror = () => r(def);
      });
    } catch {
      return def;
    }
  },
  async set(k, v) {
    try {
      await DB.init();
      return new Promise((r, j) => {
        const tx = DB._db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, k);
        tx.oncomplete = () => r();
        tx.onerror = () => j(tx.error);
      });
    } catch {}
  },
  async del(k) {
    try {
      await DB.init();
      return new Promise(r => {
        const tx = DB._db.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete(k);
        tx.oncomplete = () => r();
      });
    } catch {}
  }
};
function useP(key, init) {
  const [v, setV] = useState(init);
  useEffect(() => {
    let m = true;
    DB.get(key).then(s => {
      if (m && s != null) setV(s);
    });
    return () => {
      m = false;
    };
  }, [key]);
  const upd = useCallback(fn => {
    setV(p => {
      const n = typeof fn === "function" ? fn(p) : fn;
      DB.set(key, n);
      return n;
    });
  }, [key]);
  return [v, upd];
}

async function yf(ticker, range = "1y") {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=${range}&interval=1d&includePrePost=false`;
  const proxies = [
    `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://corsproxy.io/?${encodeURIComponent(url)}`
  ];
  let lastErr = "";
  for (let pi = 0; pi < proxies.length; pi++) {
    try {
      const ctrl = new AbortController();
      const tm = setTimeout(() => ctrl.abort(), 20000);
      const res = await fetch(proxies[pi], { signal: ctrl.signal });
      clearTimeout(tm);
      if (!res.ok) { lastErr = `Proxy${pi} HTTP ${res.status}`; continue; }
      const txt = await res.text();
      let raw;
      try { const env = JSON.parse(txt); raw = env.contents ? JSON.parse(env.contents) : env; } catch { raw = JSON.parse(txt); }
      if (!raw?.chart?.result?.[0]) { lastErr = `Proxy${pi} no chart data`; continue; }
      const r = raw.chart.result[0], ts = r.timestamp || [], q = r.indicators?.quote?.[0] || {}, m = r.meta || {};
      const candles = ts.map((t, i) => ({ date: new Date(t * 1000).toISOString().slice(0, 10), ts: t, o: q.open?.[i], h: q.high?.[i], l: q.low?.[i], c: q.close?.[i], v: q.volume?.[i] })).filter(c => c.c != null && c.v != null);
      if (!candles.length) { lastErr = `Proxy${pi} empty candles`; continue; }
      const last = candles[candles.length - 1], prev = candles.length > 1 ? candles[candles.length - 2] : last;
      const price = m.regularMarketPrice || last.c;
      const quote = { ticker, price, prevClose: prev.c, change: prev.c ? ((price - prev.c) / prev.c * 100) : 0, volume: last.v, high: last.h, low: last.l, open: last.o, name: m.shortName || m.symbol || ticker, currency: m.currency || "ARS", ts: Date.now() };
      return { quote, candles };
    } catch (e) { lastErr = `Proxy${pi}: ${e.message}`; }
  }
  throw new Error(lastErr || "all proxies failed");
}

const TA = {
  sma(d, p) {
    const r = [];
    for (let i = 0; i < d.length; i++) {
      if (i < p - 1) {
        r.push(null);
        continue;
      }
      let s = 0;
      for (let j = i - p + 1; j <= i; j++) s += d[j];
      r.push(s / p);
    }
    return r;
  },
  ema(d, p) {
    const r = [],
      k = 2 / (p + 1);
    let prev = null;
    for (let i = 0; i < d.length; i++) {
      if (i < p - 1) {
        r.push(null);
        continue;
      }
      if (prev === null) {
        let s = 0;
        for (let j = i - p + 1; j <= i; j++) s += d[j];
        prev = s / p;
      } else prev = d[i] * k + prev * (1 - k);
      r.push(prev);
    }
    return r;
  },
  rsi(c, p = 14) {
    const r = new Array(c.length).fill(null);
    let g = 0,
      l = 0;
    for (let i = 1; i <= p; i++) {
      const d = c[i] - c[i - 1];
      if (d > 0) g += d;else l -= d;
    }
    g /= p;
    l /= p;
    r[p] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    for (let i = p + 1; i < c.length; i++) {
      const d = c[i] - c[i - 1];
      g = (g * (p - 1) + (d > 0 ? d : 0)) / p;
      l = (l * (p - 1) + (d < 0 ? -d : 0)) / p;
      r[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    }
    return r;
  },
  macd(c, f = 12, s = 26, sg = 9) {
    const eF = TA.ema(c, f),
      eS = TA.ema(c, s),
      line = eF.map((v, i) => v != null && eS[i] != null ? v - eS[i] : null),
      valid = line.filter(v => v != null),
      sigL = TA.ema(valid, sg);
    let si = 0;
    const signal = line.map(v => v == null ? null : sigL[si++] ?? null),
      hist = line.map((v, i) => v != null && signal[i] != null ? v - signal[i] : null);
    return {
      line,
      signal,
      histogram: hist
    };
  },
  bollinger(c, p = 20, m = 2) {
    const mid = TA.sma(c, p),
      u = [],
      l = [];
    for (let i = 0; i < c.length; i++) {
      if (mid[i] == null) {
        u.push(null);
        l.push(null);
        continue;
      }
      let sq = 0;
      for (let j = i - p + 1; j <= i; j++) sq += (c[j] - mid[i]) ** 2;
      const std = Math.sqrt(sq / p);
      u.push(mid[i] + m * std);
      l.push(mid[i] - m * std);
    }
    return {
      upper: u,
      middle: mid,
      lower: l
    };
  },
  stochastic(cd, kP = 14, dP = 3) {
    const kA = new Array(cd.length).fill(null);
    for (let i = kP - 1; i < cd.length; i++) {
      let hh = -Infinity,
        ll = Infinity;
      for (let j = i - kP + 1; j <= i; j++) {
        if (cd[j].h > hh) hh = cd[j].h;
        if (cd[j].l < ll) ll = cd[j].l;
      }
      kA[i] = hh !== ll ? (cd[i].c - ll) / (hh - ll) * 100 : 50;
    }
    const dA = TA.sma(kA.map(v => v ?? 0), dP).map((v, i) => kA[i] != null ? v : null);
    return {
      k: kA,
      d: dA
    };
  },
  atr(cd, p = 14) {
    const r = new Array(cd.length).fill(null),
      tr = [];
    for (let i = 1; i < cd.length; i++) tr.push(Math.max(cd[i].h - cd[i].l, Math.abs(cd[i].h - cd[i - 1].c), Math.abs(cd[i].l - cd[i - 1].c)));
    if (tr.length < p) return r;
    let avg = 0;
    for (let i = 0; i < p; i++) avg += tr[i];
    avg /= p;
    r[p] = avg;
    for (let i = p; i < tr.length; i++) {
      avg = (avg * (p - 1) + tr[i]) / p;
      r[i + 1] = avg;
    }
    return r;
  },
  obv(cd) {
    const r = [0];
    for (let i = 1; i < cd.length; i++) {
      if (cd[i].c > cd[i - 1].c) r.push(r[i - 1] + cd[i].v);else if (cd[i].c < cd[i - 1].c) r.push(r[i - 1] - cd[i].v);else r.push(r[i - 1]);
    }
    return r;
  },
  williamsR(cd, p = 14) {
    const r = new Array(cd.length).fill(null);
    for (let i = p - 1; i < cd.length; i++) {
      let hh = -Infinity,
        ll = Infinity;
      for (let j = i - p + 1; j <= i; j++) {
        if (cd[j].h > hh) hh = cd[j].h;
        if (cd[j].l < ll) ll = cd[j].l;
      }
      r[i] = hh !== ll ? (hh - cd[i].c) / (hh - ll) * -100 : -50;
    }
    return r;
  },
  cci(cd, p = 20) {
    const r = new Array(cd.length).fill(null),
      tp = cd.map(c => (c.h + c.l + c.c) / 3);
    for (let i = p - 1; i < cd.length; i++) {
      let s = 0;
      for (let j = i - p + 1; j <= i; j++) s += tp[j];
      const avg = s / p;
      let md = 0;
      for (let j = i - p + 1; j <= i; j++) md += Math.abs(tp[j] - avg);
      md /= p;
      r[i] = md ? (tp[i] - avg) / (.015 * md) : 0;
    }
    return r;
  },
  mfi(cd, p = 14) {
    const r = new Array(cd.length).fill(null),
      tp = cd.map(c => (c.h + c.l + c.c) / 3),
      mf = tp.map((t, i) => t * cd[i].v);
    for (let i = p; i < cd.length; i++) {
      let pos = 0,
        neg = 0;
      for (let j = i - p + 1; j <= i; j++) {
        if (tp[j] > tp[j - 1]) pos += mf[j];else neg += mf[j];
      }
      r[i] = neg ? 100 - 100 / (1 + pos / neg) : 100;
    }
    return r;
  },
  roc(c, p = 12) {
    return c.map((v, i) => i < p ? null : (v - c[i - p]) / c[i - p] * 100);
  },
  trix(c, p = 15) {
    const e1 = TA.ema(c, p),
      e2 = TA.ema(e1.map(v => v ?? 0), p),
      e3 = TA.ema(e2.map(v => v ?? 0), p);
    return e3.map((v, i) => i < 1 || !e3[i - 1] ? null : (v - e3[i - 1]) / e3[i - 1] * 10000);
  },
  ichimoku(cd, t = 9, k = 26) {
    const mid = (arr, p, i) => {
      let hh = -Infinity,
        ll = Infinity;
      for (let j = Math.max(0, i - p + 1); j <= i; j++) {
        if (arr[j].h > hh) hh = arr[j].h;
        if (arr[j].l < ll) ll = arr[j].l;
      }
      return (hh + ll) / 2;
    };
    return {
      tenkan: cd.map((_, i) => i >= t - 1 ? mid(cd, t, i) : null),
      kijun: cd.map((_, i) => i >= k - 1 ? mid(cd, k, i) : null)
    };
  },
  chaikin(cd, f = 3, s = 10) {
    const adl = [0];
    for (let i = 1; i < cd.length; i++) {
      const hl = cd[i].h - cd[i].l;
      const mfm = hl ? (cd[i].c - cd[i].l - (cd[i].h - cd[i].c)) / hl : 0;
      adl.push(adl[i - 1] + mfm * cd[i].v);
    }
    const ef = TA.ema(adl, f),
      es = TA.ema(adl, s);
    return ef.map((f, i) => f != null && es[i] != null ? f - es[i] : null);
  }
};
function analyze(candles) {
  if (!candles || candles.length < 60) return null;
  const c = candles.map(x => x.c),
    L = candles.length - 1;
  const rsi = TA.rsi(c),
    macd = TA.macd(c),
    bb = TA.bollinger(c),
    stoch = TA.stochastic(candles),
